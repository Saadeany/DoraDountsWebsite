# ── Felt & Form — nginx config for the frontend container ───────────────
# Place this file at frontend/nginx.conf in the repo.
# TLS termination happens one layer above this (host nginx/Caddy + certbot,
# or a Traefik/Caddy reverse-proxy container) — see DEPLOYMENT.md.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ───────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Left off here deliberately: HSTS. Set it on the TLS-terminating layer
    # (host nginx/Caddy) once HTTPS is confirmed working end-to-end —
    # enabling HSTS before TLS is solid can lock users out of the site.

    gzip on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ── API — proxied to the backend container over the internal network ─
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Uploaded product/category/profile images ──────────────────────
    location ^~ /uploads/ {
        proxy_pass http://backend:5000/uploads/;

        proxy_set_header Host $host;
    }

    # ── Static assets — long cache, filenames are content-hashed by Vite ─
    location ~* \.(?:css|js|mjs|woff2?|ttf|otf|svg|jpg|jpeg|png|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't serve dotfiles (e.g. a stray .env if ever copied in by mistake)
    location ~ /\. {
        deny all;
    }
}
